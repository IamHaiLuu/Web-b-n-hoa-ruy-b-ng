<div class="space-y-stack-sm">
<label class="block font-label-caps text-label-caps text-text-primary uppercase tracking-wider" for="email">
                            Email quản trị
                        </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-12 pr-4 py-3 rounded-xl bg-bg-ash-rose border-none focus:ring-2 focus:ring-primary-container text-text-primary font-body-md text-body-md placeholder:text-outline/70 transition-all outline-none" id="email" name="email" placeholder="admin@menuhoa.vn" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-stack-sm">
<label class="block font-label-caps text-label-caps text-text-primary uppercase tracking-wider" for="password">
                            Mật khẩu
                        </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-12 pr-4 py-3 rounded-xl bg-bg-ash-rose border-none focus:ring-2 focus:ring-primary-container text-text-primary font-body-md text-body-md placeholder:text-outline/70 transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>

<div class="flex items-center gap-2">
<input class="rounded border-border-light text-primary focus:ring-primary-container bg-bg-ash-rose" id="remember" type="checkbox"/>
<label class="font-body-md text-[14px] text-text-secondary cursor-pointer" for="remember">Ghi nhớ đăng nhập</label>
</div>
<a class="font-body-md text-[14px] text-primary hover:text-surface-tint transition-colors underline decoration-border-light underline-offset-4" href="#">

                        </a>
